# .github/workflows/build-openssl-fips.yml

name: Build FIPS-Compliant OpenSSL Binaries (All Platforms)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENSSL_VERSION: "4.0.2" 
  OPENSSL_SHA256: "736b467530f916737b7031310ccb21d8218c6229e61e8e160cd1d3458cd543a8"

jobs:
  # ---------------------------------------------------------
  # 1. WINDOWS (x64)
  # ---------------------------------------------------------
  build_windows_x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Install NASM
        run: choco install nasm
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - name: Download Official OpenSSL Tarball
        run: Invoke-WebRequest -Uri "https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION }}/openssl-${{ env.OPENSSL_VERSION }}.tar.gz" -OutFile "openssl.tar.gz"
      - name: Verify FIPS Chain of Custody (SHA256 Checksum)
        run: |
          $hash = (Get-FileHash "openssl.tar.gz" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "${{ env.OPENSSL_SHA256 }}") { Write-Error "FIPS Checksum mismatch!"; exit 1 }
      - name: Extract Source Code
        run: tar -xf openssl.tar.gz
      - name: Configure, Compile and Install (MSVC)
        working-directory: openssl-${{ env.OPENSSL_VERSION }}
        run: |
          perl Configure VC-WIN64A shared enable-fips --prefix=${{ github.workspace }}\output_win_x64
          # /MP tells MSVC to use all available CPU cores concurrently
          # CL="/MP" nmake runs the compiler in parallel
          nmake /M CL="/MP"
          nmake install
        shell: cmd
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows_x64
          path: ${{ github.workspace }}\output_win_x64\

  # ---------------------------------------------------------
  # 2. LINUX (x64 & ARM64)
  # ---------------------------------------------------------
  build_linux_x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Download Tarball & Verify
        run: |
          curl -LO https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION }}/openssl-${{ env.OPENSSL_VERSION }}.tar.gz
          echo "${{ env.OPENSSL_SHA256 }}  openssl-${{ env.OPENSSL_VERSION }}.tar.gz" | sha256sum --check
          tar -xf openssl-${{ env.OPENSSL_VERSION }}.tar.gz
      - name: Configure, Compile and Install
        working-directory: openssl-${{ env.OPENSSL_VERSION }}
        run: |
          ./Configure linux-x86_64 shared enable-fips --prefix=${{ github.workspace }}/output_linux_x64
          make -j$(nproc)
          make install
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux_x64
          path: ${{ github.workspace }}/output_linux_x64/

  build_linux_arm64:
    name: Build Linux ARM64 (Cross-Compile)
    runs-on: ubuntu-latest
    steps:
      - name: Install ARM64 Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Download Tarball & Verify
        run: |
          curl -LO https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION }}/openssl-${{ env.OPENSSL_VERSION }}.tar.gz
          echo "${{ env.OPENSSL_SHA256 }}  openssl-${{ env.OPENSSL_VERSION }}.tar.gz" | sha256sum --check
          tar -xf openssl-${{ env.OPENSSL_VERSION }}.tar.gz
      - name: Configure, Compile and Install
        working-directory: openssl-${{ env.OPENSSL_VERSION }}
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          ./Configure linux-aarch64 shared enable-fips --prefix=${{ github.workspace }}/output_linux_arm64
          make -j$(nproc)
          make install
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux_arm64
          path: ${{ github.workspace }}/output_linux_arm64/

  # ---------------------------------------------------------
  # 3. ANDROID (ARM64)
  # ---------------------------------------------------------
  build_android_arm64:
    name: Build Android ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Download Tarball & Verify
        run: |
          curl -LO https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION }}/openssl-${{ env.OPENSSL_VERSION }}.tar.gz
          echo "${{ env.OPENSSL_SHA256 }}  openssl-${{ env.OPENSSL_VERSION }}.tar.gz" | sha256sum --check
          tar -xf openssl-${{ env.OPENSSL_VERSION }}.tar.gz
      - name: Configure, Compile and Install (NDK)
        working-directory: openssl-${{ env.OPENSSL_VERSION }}
        run: |
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          ./Configure android-arm64 -D__ANDROID_API__=29 shared enable-fips --prefix=${{ github.workspace }}/output_android_arm64
          make -j$(nproc)
          make install
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android_arm64
          path: ${{ github.workspace }}/output_android_arm64/

  # ---------------------------------------------------------
  # 4. MACOS (ARM64)
  # ---------------------------------------------------------
  build_macos_arm64:
    name: Build macOS ARM64 (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Download Tarball & Verify
        run: |
          curl -LO https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION }}/openssl-${{ env.OPENSSL_VERSION }}.tar.gz
          echo "${{ env.OPENSSL_SHA256 }}  openssl-${{ env.OPENSSL_VERSION }}.tar.gz" | shasum -a 256 -c -
          tar -xf openssl-${{ env.OPENSSL_VERSION }}.tar.gz
      - name: Configure, Compile and Install
        working-directory: openssl-${{ env.OPENSSL_VERSION }}
        run: |
          ./Configure darwin64-arm64-cc shared enable-fips --prefix=${{ github.workspace }}/output_macos_arm64
          make -j$(sysctl -n hw.logicalcpu)
          make install
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos_arm64
          path: ${{ github.workspace }}/output_macos_arm64/

  # ---------------------------------------------------------
  # 5. IOS (ARM64)
  # ---------------------------------------------------------
  build_ios_arm64:
    name: Build iOS ARM64
    runs-on: macos-latest
    steps:
      - name: Download Tarball & Verify
        run: |
          curl -LO https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION }}/openssl-${{ env.OPENSSL_VERSION }}.tar.gz
          echo "${{ env.OPENSSL_SHA256 }}  openssl-${{ env.OPENSSL_VERSION }}.tar.gz" | shasum -a 256 -c -
          tar -xf openssl-${{ env.OPENSSL_VERSION }}.tar.gz
      - name: Configure, Compile and Install (Xcode SDK)
        working-directory: openssl-${{ env.OPENSSL_VERSION }}
        run: |
          ./Configure ios64-xcrun shared enable-fips --prefix=${{ github.workspace }}/output_ios_arm64
          make -j$(sysctl -n hw.logicalcpu)
          make install
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios_arm64
          path: ${{ github.workspace }}/output_ios_arm64/

  # ---------------------------------------------------------
  # 6. PACKAGE, HASH & RELEASE
  # ---------------------------------------------------------
  publish_release:
    name: Create Release & Generate Hashes
    needs: [build_windows_x64, build_linux_x64, build_linux_arm64, build_android_arm64, build_macos_arm64, build_ios_arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Zips and Calculate SHA256
        working-directory: artifacts
        run: |
          touch sha256sums.txt
          echo "Cryptographic hashes for OpenSSL ${{ env.OPENSSL_VERSION }} native binaries:" > sha256sums.txt
          echo "==========================================================================" >> sha256sums.txt
          
          for dir in */; do
            platform=${dir%/}
            echo "Packaging $platform..."
            zip -r "${platform}.zip" "$platform"
            sha256sum "${platform}.zip" >> sha256sums.txt
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.OPENSSL_VERSION }}-fips"
          name: "OpenSSL ${{ env.OPENSSL_VERSION }} (FIPS Native Binaries)"
          body: |
            Automated FIPS 140-3 compliant build for OpenSSL ${{ env.OPENSSL_VERSION }}.
            
            Compiled entirely on isolated GitHub Actions runners using official source code.
            Please verify the integrity of the downloaded zip files using the attached `sha256sums.txt`.
          files: |
            artifacts/*.zip
            artifacts/sha256sums.txt
